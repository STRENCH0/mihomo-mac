name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: Application version for the test build
        required: true
        default: '0.1.1'
        type: string
      notarize:
        description: Notarize the test build with Apple
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Validate version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a version in X.Y.Z or vX.Y.Z format.' >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=MihomoMac-$version-universal.zip" >> "$GITHUB_ENV"

      - name: Install signing certificate
        id: signing
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Approve reviewed package plugins
        run: |
          mkdir -p "$HOME/Library/org.swift.swiftpm/security"
          cp .github/trusted-package-plugins.json "$HOME/Library/org.swift.swiftpm/security/plugins.json"

      - name: Run tests
        run: |
          xcodebuild test \
            -project MihomoMac.xcodeproj \
            -scheme MihomoMac \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual

      - name: Build universal application
        env:
          SIGNING_IDENTITY: ${{ fromJSON(steps.signing.outputs.identities)[0].hash }}
        run: |
          xcodebuild build \
            -project MihomoMac.xcodeproj \
            -scheme MihomoMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            CODE_SIGN_STYLE=Manual \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS=--timestamp

      - name: Include licenses and verify application
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_IDENTITY: ${{ fromJSON(steps.signing.outputs.identities)[0].hash }}
        run: |
          app=build/DerivedData/Build/Products/Release/MihomoMac.app
          python3 scripts/collect-licenses.py \
            MihomoMac.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            "$app/Contents/Resources/Licenses"
          codesign --force --sign "$SIGNING_IDENTITY" --options runtime --timestamp \
            --entitlements MihomoMac/MihomoMac.entitlements "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          architectures="$(lipo -archs "$app/Contents/MacOS/MihomoMac")"
          for architecture in arm64 x86_64; do
            if [[ " $architectures " != *" $architecture "* ]]; then
              echo "Missing application architecture: $architecture" >&2
              exit 1
            fi
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"

      - name: Notarize application
        if: github.event_name == 'push' || inputs.notarize
        uses: Apple-Actions/notarize@d649d467921916bbaa3a37e32c825f01535ae843
        with:
          path: build/DerivedData/Build/Products/Release/MihomoMac.app
          issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_API_KEY_P8 }}
          timeout: 15m

      - name: Package application
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/DerivedData/Build/Products/Release/MihomoMac.app "dist/$ARCHIVE_NAME"
          cd dist
          shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MihomoMac-${{ env.VERSION }}-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' \
            'Requires macOS 14 or later. Universal application for Apple Silicon and Intel Macs.' \
            '' \
            'Signed with Developer ID Application and notarized by Apple.' \
            '' \
            'Download the ZIP, extract it, and move MihomoMac.app to Applications.' \
            'The mihomo kernel is installed separately.' > build/release-notes.md
          gh release create "$RELEASE_TAG" "dist/$ARCHIVE_NAME" "dist/$ARCHIVE_NAME.sha256" \
            --verify-tag --title "MihomoMac $VERSION" --notes-file build/release-notes.md --generate-notes

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: TestResults
          path: build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
